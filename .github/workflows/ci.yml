name: CI Pipeline

on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    branches:
      - main
      - release/*

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run E2E tests (for release branches only)
        if: startsWith(github.ref, 'refs/heads/release/')
        run: npm run e2e

      - name: Build project
        run: npm run build

      - name: Deploy to Staging (for staging branch)
        if: github.ref == 'refs/heads/staging'
        run: vercel --prod

      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        run: vercel --prod
